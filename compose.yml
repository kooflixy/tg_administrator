services:
  postgres:
    image: postgres:17-alpine
    container_name: psgr
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - dbnet

  adminer:
    image: adminer
    container_name: adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    links:
      - "postgres:db"
    networks:
      - dbnet
    depends_on:
      - postgres

  app:
    build: .
    image: tg_miva_admin_bot
    container_name: tg_miva_bot
    restart: unless-stopped
    command: sh -c "while ! nc -z postgres 5432; do sleep 1; done && alembic upgrade head && python main.py"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}

      - TG_BOT_API_TOKEN=${TG_BOT_API_TOKEN}

      - TELETHON_API_ID=${TELETHON_API_ID}
      - TELETHON_API_HASH=${TELETHON_API_HASH}
      - ADMIN_ID=${ADMIN_ID}
      - DEVELOPER_ID=${DEVELOPER_ID}
    links:
      - "postgres:dbps"
    networks:
      - dbnet
    volumes:
      - ./:/app/db/data
    depends_on:
      - postgres

networks:
  dbnet:
    driver: bridge

volumes:
  postgres-data: